name: Build and release Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Test, build, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Android SDK
        env:
          ANDROID_TOOLS_VERSION: "16111833"
        run: |
          SDK_ROOT="$RUNNER_TEMP/android-sdk"
          curl --fail --location --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_TOOLS_VERSION}_latest.zip" \
            --output "$RUNNER_TEMP/android-command-line-tools.zip"
          unzip -q "$RUNNER_TEMP/android-command-line-tools.zip" -d "$RUNNER_TEMP/android-command-line-tools"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          mv "$RUNNER_TEMP/android-command-line-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDK_ROOT/cmdline-tools/latest/bin/android" --sdk="$SDK_ROOT" sdk install "platforms/android-36"
          "$SDK_ROOT/cmdline-tools/latest/bin/android" --sdk="$SDK_ROOT" sdk install "build-tools/35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Run unit tests
        run: npm test

      - name: Sync Android project
        run: npm run android:sync

      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wortpause-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/wortpause-release.jks" >> "$GITHUB_ENV"

      - name: Build signed installable APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk | tee signature.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" signature.txt

      - name: Prepare APK
        id: apk
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/Wortpause-Android.apk
          echo "sha256=$(sha256sum release/Wortpause-Android.apk | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wortpause-Android-${{ github.run_number }}
          path: release/Wortpause-Android.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          cat > release-notes.md <<EOF
          Automated Android build from commit ${GITHUB_SHA}.

          - Install file: \`Wortpause-Android.apk\`
          - Minimum Android version: Android 7.0
          - SHA-256: \`${APK_SHA256}\`

          Android may ask you to allow installation from your browser or file manager because this app is distributed outside Google Play.
          EOF
          gh release create "$TAG" \
            "release/Wortpause-Android.apk#Wortpause-Android.apk" \
            --target "$GITHUB_SHA" \
            --title "Wortpause Build #${GITHUB_RUN_NUMBER}" \
            --notes-file release-notes.md \
            --latest
